# A second copy of the Lab 3 api, labelled v2, so the canary and weighted
# routes above have somewhere to send traffic. Apply this BEFORE 02 and 03.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  namespace: lab3
  labels:
    app: api-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-canary
  template:
    metadata:
      labels:
        app: api-canary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: lab3-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VERSION
              value: "v2-canary"          # so you can tell responses apart
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: lab3
spec:
  selector:
    app: api-canary
  ports:
    - port: 80
      targetPort: http
      name: http
