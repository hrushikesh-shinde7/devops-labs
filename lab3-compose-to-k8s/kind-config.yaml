kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080      # NodePort -> localhost:8080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker                  # 2 workers so you can see scheduling decisions
