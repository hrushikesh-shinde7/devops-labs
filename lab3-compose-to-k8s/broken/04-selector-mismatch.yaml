# EXERCISE 7 — the silent one.
# The Service selector no longer matches any pod label. No error. No event.
# No failing probe. The Service simply has zero endpoints and every request
# gets "connection refused".
#
# Diagnose with the command that should be your reflex:
#   kubectl -n lab3 get endpointslice -l kubernetes.io/service-name=api
#   (empty = the selector is wrong, not the app)
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab3
spec:
  type: ClusterIP
  selector:
    app: api-v2          # <-- no pod has this label
  ports:
    - port: 80
      targetPort: http
      name: http
