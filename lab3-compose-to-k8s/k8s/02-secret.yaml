# ⚠️ A plain Secret is base64, NOT encrypted. It is fine for a local kind
# cluster and NOT fine for a real one — see 09_Security_Secrets_SupplyChain.md
# (External Secrets Operator / Key Vault CSI driver / SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: lab3
type: Opaque
stringData:
  API_TOKEN: "local-dev-token-not-a-real-secret"
