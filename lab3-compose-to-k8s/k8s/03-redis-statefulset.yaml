# Compose: `redis:` + a named volume.
# K8s:     StatefulSet — stable name (redis-0), stable storage, ordered startup.
# A Deployment would also "work" here, but a new pod gets a NEW volume; the
# StatefulSet's volumeClaimTemplate binds redis-0 to its own PVC forever.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: lab3
spec:
  clusterIP: None              # headless — gives redis-0.redis.lab3.svc DNS
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: lab3
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }          # no CPU limit — see README §QoS
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
